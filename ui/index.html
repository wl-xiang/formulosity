<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('formulosity_theme')
          if (theme !== 'light' && theme !== 'dark') {
            var prefersDark =
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            theme = prefersDark ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme

          var locale = localStorage.getItem('formulosity_locale')
          if (locale !== 'en' && locale !== 'zh-CN') {
            var languages = navigator.languages || [navigator.language || '']
            locale = 'en'
            for (var i = 0; i < languages.length; i++) {
              var language = String(languages[i]).toLowerCase()
              if (language.indexOf('zh') === 0) {
                locale = 'zh-CN'
                break
              }
              if (language.indexOf('en') === 0) {
                locale = 'en'
                break
              }
            }
          }
          document.documentElement.lang = locale
        } catch (error) {
          // Preferences are best-effort; the app still works without storage access.
        }
      })()
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulosity</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
