<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('formulosity_theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme

          var locale = localStorage.getItem('formulosity_locale')
          if (locale !== 'en' && locale !== 'zh-CN') {
            var languages = navigator.languages || [navigator.language || '']
            var isChinese = languages.some(function (language) {
              return String(language).toLowerCase().indexOf('zh') === 0
            })
            locale = isChinese ? 'zh-CN' : 'en'
          }
          document.documentElement.lang = locale
        } catch (error) {
          // Preferences are best-effort; the app still works without storage access.
        }
      })()
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulosity</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
